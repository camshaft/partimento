name: release

# Release pipeline with no stored token, after the camshaft release pattern (backbeat, bach,
# bolero, etude). On each push to main, release-plz (https://release-plz.dev):
#   - `release-pr` keeps a pull request open that raises the version and updates the CHANGELOG.
#   - `release`, once that pull request merges, publishes the crate to crates.io, pushes the tag
#     v<version> and creates the GitHub release. release-plz.toml sets `release_always = false`,
#     so no other push to main publishes anything.
#
# The static Linux programs for x86_64 and aarch64, and their SHA-256 sums, attach to that release:
#   - `plan` reads Cargo.toml's version, and asks for the release and the programs where the tag
#     v<version> doesn't exist yet and this push is the merge of the release pull request, the one
#     push that can create the tag, or for the programs alone where the tag's release lacks an
#     archive or its sum.
#   - `binaries` builds them with the read-only token from the commit the tag is on or goes on:
#     release-plz tags the release pull request's last commit where the pull request merged with a
#     merge commit, and the pushed commit otherwise.
#   - `release` attaches each missing file to the release v<version> once the tag exists, and
#     creates the release where the tag has none, so a release published in an earlier run without
#     its programs gets them on the next run.
# Only `release-pr` and `release` hold a write token, and neither of them builds the programs.
#
# crates.io Trusted Publishing through GitHub OIDC (rust-lang/crates-io-auth-action): no
# CARGO_REGISTRY_TOKEN and no personal token. The publisher is registered on crates.io for the
# repository camshaft/partimento and the workflow release.yml. `release` runs the auth step only
# where `plan` asks for the release, so a push to main that releases nothing doesn't ask crates.io
# for a token. Until the publisher is registered, the auth step fails on the release pull
# request's merge, and the `release` job stops before it publishes anything.

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  # Keep the pull request that raises the version and updates the CHANGELOG open and current.
  release-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: release-plz release-pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Read Cargo.toml's version, and decide whether release-plz has a release to make, and whether
  # this run builds the programs and from which commit: a release and the commit release-plz tags
  # where the tag v<version> doesn't exist yet and this push is the merge of the release pull
  # request, or no release and the tag's commit where its release lacks an archive or its sum.
  plan:
    name: plan the programs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # read this push's pull requests and the release pull request's commits
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: Plan the programs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "partimento") | .version')"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if ! commit="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
            # No tag of this version yet. release-plz.toml sets `release_always = false`, so
            # `release` creates the tag only where this commit belongs to a pull request whose
            # branch starts with release-plz's `pr_branch_prefix`: the merge of the release pull
            # request. Build on that push alone.
            commit="$GITHUB_SHA"
            prefix="$(python3 -c 'import tomllib; print(tomllib.load(open("release-plz.toml", "rb")).get("workspace", {}).get("pr_branch_prefix", "release-plz-"))')"
            code="$(curl -sS -o pulls.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100" || true)"
            if [ "$code" != 200 ]; then
              # Build and release where the pull requests can't be read, so a release doesn't go
              # without its programs or its publish.
              echo "::warning::Reading the pull requests of $GITHUB_SHA answered HTTP $code, so this run builds the programs and runs the release."
              build=true
              release=true
            else
              # jq exits 0 where one of them is the release pull request, 1 where none is, and
              # above 1 where it can't read the answer, which builds and releases as a failed read
              # does.
              match=0
              jq -e --arg prefix "$prefix" 'any(.[]; (.head.ref // "") | startswith($prefix))' pulls.json > /dev/null || match=$?
              case "$match" in
                0)
                  build=true
                  release=true
                  # release-plz tags the release pull request's last commit instead of this one
                  # where the two differ and the last commit is in this one's history, as after a
                  # merge with a merge commit (`should_release` in release-plz's command/release.rs).
                  # It reads one page of the pull request's commits, at GitHub's default page size,
                  # and uses that page's last entry: read the same page, so that this run builds the
                  # commit the tag goes on. Where that read fails, build this commit.
                  number="$(jq -r --arg prefix "$prefix" 'first(.[] | select((.head.ref // "") | startswith($prefix))) | .number' pulls.json)"
                  code="$(curl -sS -o commits.json -w '%{http_code}' \
                    -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$number/commits" || true)"
                  if [ "$code" != 200 ]; then
                    echo "::warning::Reading the commits of pull request #$number answered HTTP $code, so this run builds $GITHUB_SHA."
                  elif ! last="$(jq -r 'if type == "array" then (.[-1].sha // "") else error("not a list of commits") end' commits.json)"; then
                    echo "::warning::jq couldn't read the commits of pull request #$number, so this run builds $GITHUB_SHA."
                  elif [[ "$last" =~ ^[0-9a-f]{40}$ ]] && [ "$last" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$last" "$GITHUB_SHA" 2> /dev/null; then
                    echo "release-plz tags pull request #$number's last commit, $last, which is in the history of $GITHUB_SHA: this run builds it."
                    commit="$last"
                  fi
                  ;;
                1)
                  echo "There is no tag $tag yet, and this push isn't the release pull request's merge, so it can't create the tag: this run doesn't build the programs or run the release."
                  build=false
                  release=false
                  ;;
                *)
                  echo "::warning::jq couldn't read the pull requests of $GITHUB_SHA (exit status $match), so this run builds the programs and runs the release."
                  build=true
                  release=true
                  ;;
              esac
            fi
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
            echo "build=$build" >> "$GITHUB_OUTPUT"
            echo "release=$release" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The tag exists, so release-plz released this version already and has nothing to
          # release: build from the tag's commit where its release lacks an archive or its sum.
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release=false" >> "$GITHUB_OUTPUT"
          code="$(curl -sS -o release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          case "$code" in
            200) jq -r '.assets[].name' release.json > assets.txt ;;
            404) : > assets.txt ;;
            *) echo "Reading the release $tag answered HTTP $code." >&2; exit 1 ;;
          esac
          build=false
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            for file in "partimento-$target.tar.gz" "partimento-$target.tar.gz.sha256"; do
              grep -qxF "$file" assets.txt || build=true
            done
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # Build the partimento program for each target from the commit `plan` chose, with the read-only
  # token, and keep the archive and its SHA-256 sum as this run's artifacts for `release`.
  binaries:
    name: binaries ${{ matrix.target }}
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static Linux programs through musl, each built on a runner of its own architecture.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup override set stable
      # musl-tools holds the musl-gcc compiler driver that C code built for the *-linux-musl
      # targets uses.
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the partimento program
        env:
          TARGET: ${{ matrix.target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --bin partimento --target "$TARGET"
      - name: Archive the program with its SHA-256 sum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir dist
          tar -czf "dist/partimento-$TARGET.tar.gz" -C "target/$TARGET/release" partimento
          (cd dist && sha256sum "partimento-$TARGET.tar.gz" > "partimento-$TARGET.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: partimento-${{ matrix.target }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # After the release pull request merges: publish the crate through OIDC, push the tag and create
  # the GitHub release, then attach the programs `binaries` built. The crates.io auth and
  # release-plz's release run only where `plan` asks for the release, and the job runs only where
  # `plan` asks for the release or the programs, so a push to main without either passes. It waits
  # for `binaries` and doesn't run after a failed build, so a version doesn't publish while its
  # programs fail to build.
  release:
    name: release-plz release (publish + tag)
    needs: [plan, binaries]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') && (needs.plan.outputs.release == 'true' || needs.plan.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the GitHub release and attach the programs to it
      id-token: write # crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      # Trade the GitHub OIDC id-token for a short-lived crates.io token where `plan` asks for the
      # release.
      - name: crates.io auth (OIDC Trusted Publishing)
        if: ${{ needs.plan.outputs.release == 'true' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: release-plz release
        if: ${{ needs.plan.outputs.release == 'true' }}
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Download the programs
        if: ${{ needs.plan.outputs.build == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: partimento-*
          path: dist
          merge-multiple: true
      # Attach each file the release v<version> lacks: this run's release, or one an earlier run
      # published without its programs. Where no tag of the version exists yet, as on a push that
      # releases nothing, it doesn't attach anything. Where the tag is at another commit than this
      # run built, as on a push that races a release, it doesn't attach the programs either: the
      # next run builds from the tag's commit where its release still lacks a file.
      - name: Attach the programs to the release
        if: ${{ needs.plan.outputs.build == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          BUILT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if ! commit="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")"; then
            echo "There is no tag $TAG yet, so this run doesn't attach anything."
            exit 0
          fi
          if [ "$commit" != "$BUILT" ]; then
            echo "::notice::The tag $TAG is at $commit, but this run built the programs from $BUILT, so it doesn't attach them."
            exit 0
          fi
          code="$(curl -sS -o release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          case "$code" in
            200) jq -r '.assets[].name' release.json > assets.txt ;;
            404)
              # The tag exists without its release, as where the release's creation failed after
              # the publish: create it.
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
              : > assets.txt
              ;;
            *) echo "Reading the release $TAG answered HTTP $code." >&2; exit 1 ;;
          esac
          missing=()
          for file in dist/*; do
            grep -qxF "$(basename "$file")" assets.txt || missing+=("$file")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${missing[@]}"
          fi
