[section]
anchor = "greeting"
title = "Greeting"
problem = "A person who starts the program doesn't know that it runs."
motivation = "A greeting tells the person that the program runs."

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-001"
level = "MUST"
polarity = "required"
statement = "The program MUST print a greeting of at most 80 characters."
params = [{ name = "greeting.length", bound = "max", type = "count", value = 80 }]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-002"
level = "SHOULD"
polarity = "required"
statement = "The program SHOULD print a greeting of at least 100 characters."
params = [{ name = "greeting.length", bound = "min", type = "count", value = 100 }]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-003"
level = "MAY"
polarity = "required"
statement = "The program MAY print a greeting of exactly 60 characters."
params = [{ name = "greeting.length", bound = "exact", type = "count", value = 60 }]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-004"
level = "MAY"
polarity = "required"
statement = "The program MAY print the time beside the greeting."
params = [{ name = "time.width", bound = "about", value = 8 }]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-005"
level = "MAY"
polarity = "required"
statement = "The program MAY print a greeting of exactly 70 characters."
params = [{ name = "greeting.length", bound = "exact", type = "count", value = 70 }]
