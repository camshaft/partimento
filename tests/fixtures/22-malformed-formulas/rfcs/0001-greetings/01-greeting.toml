[section]
anchor = "greeting"
title = "Greeting"
problem = "A person who starts the program doesn't know that it runs."
motivation = "A greeting tells the person that the program runs."

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-001"
level = "MUST"
polarity = "required"
statement = "The program MUST print a greeting when it starts."
compose = "all_of"
logic = ["EX-0001-002 &"]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-002"
level = "SHOULD"
polarity = "required"
statement = "The program SHOULD print a farewell when it stops."
compose = "unless"
parts = ["EX-0001-001", "EX-0001-003"]
relations = [{ kind = "follows", target = "EX-0001-001" }, { target = "EX-0001-003" }]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-003"
level = "MAY"
polarity = "required"
statement = "The program MAY print the time beside the greeting."
compose = "atomic"
parts = ["EX-0001-001"]
params = [{ name = "time.width", value = 8 }]
