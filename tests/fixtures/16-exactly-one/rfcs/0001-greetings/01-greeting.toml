[section]
anchor = "greeting"
title = "Greeting"
problem = "A person who starts the program doesn't know that it runs."
motivation = "A greeting tells the person that the program runs."

[[requirement]]
id = "EX-0001-001"
level = "MUST"
polarity = "required"
statement = "The program MUST print either a greeting or a banner when it starts."
compose = "exactly_one"
parts = ["EX-0001-002", "EX-0001-003"]

[[requirement]]
id = "EX-0001-002"
level = "SHOULD"
polarity = "required"
statement = "The program SHOULD print a greeting when it starts."

[[requirement]]
id = "EX-0001-003"
level = "MAY"
polarity = "required"
statement = "The program MAY print a banner when it starts."
