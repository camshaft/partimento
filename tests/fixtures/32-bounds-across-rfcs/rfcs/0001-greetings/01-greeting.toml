[section]
anchor = "greeting"
title = "Greeting"
problem = "A person who starts the program doesn't know that it runs."
motivation = "A greeting tells the person that the program runs."

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-001"
level = "MUST"
polarity = "required"
statement = "The program MUST print a greeting of at most 80 characters."
params = [{ name = "line.length", bound = "max", type = "count", value = 80 }]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-002"
level = "SHOULD"
polarity = "required"
statement = "The program SHOULD wait 2 seconds before it prints the greeting."
params = [{ name = "line.delay", bound = "exact", type = "duration", unit = "s", value = 2 }]
