[section]
anchor = "greeting"
title = "Greeting"
problem = "A person who starts the program doesn't know that it runs."
motivation = "A greeting tells the person that the program runs."

[[requirement]]
id = "EX-0001-001"
level = "MUST"
polarity = "required"
statement = "The program MUST keep each greeting in sqlite."

[[requirement]]
id = "EX-0001-002"
level = "SHOULD"
polarity = "required"
statement = "The program SHOULD send each greeting through a Message Queue."

[[requirement]]
id = "EX-0001-003"
level = "MAY"
polarity = "required"
statement = "The program MAY keep its greetings in sqlite3 files."
