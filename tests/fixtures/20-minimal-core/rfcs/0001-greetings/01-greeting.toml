[section]
anchor = "greeting"
title = "Greeting"
problem = "A person who starts the program doesn't know that it runs."
motivation = "A greeting tells the person that the program runs."

[[requirement]]
id = "EX-0001-001"
level = "MUST"
polarity = "required"
statement = "The program MUST print a greeting when it starts."

[[requirement]]
id = "EX-0001-002"
level = "SHOULD"
polarity = "required"
statement = "The program SHOULD print the time beside the greeting."
conditions = ["EX-0001-001"]
relations = [{ kind = "implies", target = "EX-0001-003" }]

[[requirement]]
id = "EX-0001-003"
level = "SHOULD"
polarity = "required"
statement = "The program SHOULD print the date beside the time."

[[requirement]]
id = "EX-0001-004"
level = "MUST"
polarity = "required"
statement = "The program MUST stay silent when it starts."
logic = ["EX-0001-004 -> !EX-0001-001"]
