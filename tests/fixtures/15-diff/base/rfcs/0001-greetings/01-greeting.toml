[section]
anchor = "greeting"
title = "Greeting"
problem = "A person who starts the program doesn't know that it runs."
motivation = "A greeting tells the person that the program runs."

[[requirement]]
id = "EX-0001-001"
level = "MUST"
polarity = "required"
statement = "The program MUST print a greeting when it starts."

[[requirement]]
id = "EX-0001-002"
label = "greeting-name"
level = "SHOULD"
polarity = "required"
statement = "The greeting SHOULD hold the person's name."
rationale = "A name tells the person that the greeting is for them."

[[requirement]]
id = "EX-0001-003"
level = "MAY"
polarity = "required"
statement = "The greeting MAY hold the time."

[[requirement]]
id = "EX-0001-004"
level = "MUST"
polarity = "required"
statement = "A change to the greeting MUST keep its first word."
binds_to = "process"

[[requirement]]
id = "EX-0001-005"
level = "MUST"
polarity = "required"
statement = "The program MUST print the greeting before it reads input."
conditions = ["EX-0001-001", "EX-0001-002"]

[[requirement]]
id = "EX-0001-006"
level = "MUST"
polarity = "forbidden"
statement = "The program MUST NOT print the greeting twice."

[[requirement]]
id = "EX-0001-009"
level = "SHOULD"
polarity = "required"
statement = "A change to a requirement SHOULD say why."

[[requirement]]
id = "EX-0001-010"
level = "MAY"
polarity = "required"
statement = "A change MAY add a language of the greeting."
binds_to = "process"
