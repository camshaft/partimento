[section]
anchor = "farewell"
title = "Farewell"
problem = "A person who stops the program doesn't know that it stopped."
motivation = "A farewell tells the person that the program stopped."

[[requirement]]
id = "EX-0001-006"
level = "MUST"
polarity = "forbidden"
statement = "The program MUST NOT print the greeting twice."
compose = "atomic"
binds_to = "system"

[[requirement]]
id = "EX-0001-008"
level = "SHOULD"
polarity = "required"
statement = "The program SHOULD print a farewell when it stops."
