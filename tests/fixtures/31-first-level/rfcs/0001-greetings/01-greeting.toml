[section]
anchor = "greeting"
title = "Greeting"
problem = "A person who starts the program doesn't know that it runs."
motivation = "A greeting tells the person that the program runs."

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-001"
level = "SHALL"
polarity = "required"
statement = "The program SHALL print a greeting when it starts."
relations = [{ kind = "implies", target = "EX-0001-002" }]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-002"
level = "SHALL"
polarity = "forbidden"
statement = "The program SHALL NOT print the greeting to the error stream."

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-003"
level = "MUST"
polarity = "required"
statement = "The program MUST print a farewell when it stops."
relations = [{ kind = "implies", target = "EX-0001-004" }]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-004"
level = "MUST"
polarity = "forbidden"
statement = "The program MUST NOT print the farewell to the error stream."
