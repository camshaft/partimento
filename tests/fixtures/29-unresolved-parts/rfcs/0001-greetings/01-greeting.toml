[section]
anchor = "greeting"
title = "Greeting"
problem = "A person who starts the program doesn't know that it runs."
motivation = "A greeting tells the person that the program runs."

[[requirement]]
id = "EX-0001-001"
level = "MUST"
polarity = "required"
statement = "The program MUST print a greeting or a banner when it starts."
compose = "any_of"
parts = ["EX-0001-002", "EX-0001-009"]

[[requirement]]
id = "EX-0001-002"
level = "SHOULD"
polarity = "required"
statement = "The program SHOULD print a greeting when the person asked for a farewell."
conditions = ["EX-0002-001"]

[[requirement]]
id = "EX-0001-003"
level = "MAY"
polarity = "required"
statement = "The program MAY print the time beside the greeting."
logic = ["EX-0001-003 -> EX-0001-008"]

[[requirement]]
id = "EX-0001-004"
level = "MUST"
polarity = "required"
statement = "The program MUST print a greeting unless it runs in quiet mode."
compose = "unless"
parts = ["EX-0001-007"]
