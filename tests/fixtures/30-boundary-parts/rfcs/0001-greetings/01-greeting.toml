[section]
anchor = "greeting"
title = "Greeting"
problem = "A person who starts the program doesn't know that it runs."
motivation = "A greeting tells the person that the program runs."

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-001"
level = "MUST"
polarity = "required"
statement = "The program MUST print a greeting or the job's name when it starts."
compose = "any_of"
parts = ["EX-0001-002", "EX-0200-001"]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-002"
level = "SHOULD"
polarity = "required"
statement = "The program SHOULD print a greeting when it starts."

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-003"
level = "MUST"
polarity = "required"
statement = "The program MUST print a greeting unless the job runs in quiet mode."
compose = "unless"
parts = ["EX-0200-002"]

[[requirement]]
binds_to = "system"
rationale = "The tests need this requirement."
id = "EX-0001-004"
level = "MAY"
polarity = "required"
statement = "The program MAY print the job's name beside the greeting."
logic = ["EX-0001-004 -> EX-0200-001"]
