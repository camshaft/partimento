[package]
name = "partimento"
version = "0.3.2"
edition = "2021"
rust-version = "1.88"
description = "Checks and renders structured RFC specifications"
license = "MIT"
repository = "https://github.com/camshaft/partimento"
readme = "README.md"

[features]
default = ["cli", "batsat"]
# The command, src/main.rs.
cli = []
# The solver backends, each behind its own feature: batsat by default, varisat beside it.
batsat = ["dep:batsat"]
varisat = ["dep:varisat"]

[dependencies]
batsat = { version = "0.6", optional = true }
etude-bytevec = "0.1"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
varisat = { version = "0.2.2", optional = true }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "partimento"
path = "src/main.rs"
required-features = ["cli"]

# Prints the time a check of 2,500 generated requirements takes, in each CI run's log.
[[test]]
name = "timing"
path = "tests/timing.rs"
harness = false
